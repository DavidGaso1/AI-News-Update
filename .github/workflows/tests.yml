name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python sources
        run: python3 -m compileall -q scripts test_server.py

      - name: Import smoke test
        run: python3 -c "import feedparser, httpx, bs4, lxml, dateutil; print('dependencies OK')"
